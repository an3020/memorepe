<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="300" fill="white"/>
  <text font-family="Arial" font-size="16" font-weight="500" fill="#111" x="340" y="34" text-anchor="middle">Cómo encarar una pregunta multiple choice</text>

  <!-- Paso 1 -->
  <rect x="24" y="62" width="143" height="196" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="95.5" cy="98" r="18" fill="#059669"/>
  <text font-family="Arial" font-size="15" font-weight="600" fill="white" x="95.5" y="103" text-anchor="middle">1</text>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#111" x="95.5" y="140" text-anchor="middle">Leé la consigna</text>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="95.5" y="166" text-anchor="middle">Buscá negaciones:</text>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="95.5" y="182" text-anchor="middle">"no", "excepto"</text>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="95.5" y="206" text-anchor="middle">y calificadores:</text>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="95.5" y="222" text-anchor="middle">"siempre", "solo"</text>

  <path d="M170 160 L184 160" stroke="#d1d5db" stroke-width="2"/>
  <path d="M180 155 L186 160 L180 165" fill="none" stroke="#d1d5db" stroke-width="2"/>

  <!-- Paso 2 -->
  <rect x="189" y="62" width="143" height="196" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="260.5" cy="98" r="18" fill="#059669"/>
  <text font-family="Arial" font-size="15" font-weight="600" fill="white" x="260.5" y="103" text-anchor="middle">2</text>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#111" x="260.5" y="140" text-anchor="middle">Respondé antes</text>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#111" x="260.5" y="157" text-anchor="middle">de mirar</text>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="260.5" y="182" text-anchor="middle">Con una respuesta</text>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="260.5" y="198" text-anchor="middle">en la cabeza, las</text>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="260.5" y="214" text-anchor="middle">trampas pesan menos</text>

  <path d="M335 160 L349 160" stroke="#d1d5db" stroke-width="2"/>
  <path d="M345 155 L351 160 L345 165" fill="none" stroke="#d1d5db" stroke-width="2"/>

  <!-- Paso 3 -->
  <rect x="354" y="62" width="143" height="196" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <circle cx="425.5" cy="98" r="18" fill="#059669"/>
  <text font-family="Arial" font-size="15" font-weight="600" fill="white" x="425.5" y="103" text-anchor="middle">3</text>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#111" x="425.5" y="140" text-anchor="middle">Descartá</text>
  <rect x="380" y="158" width="91" height="14" rx="4" fill="#fee2e2"/>
  <line x1="386" y1="165" x2="465" y2="165" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="380" y="178" width="91" height="14" rx="4" fill="#d1fae5"/>
  <rect x="380" y="198" width="91" height="14" rx="4" fill="#fee2e2"/>
  <line x1="386" y1="205" x2="465" y2="205" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="380" y="218" width="91" height="14" rx="4" fill="#d1fae5"/>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="425.5" y="248" text-anchor="middle">de 4 opciones a 2</text>

  <path d="M500 160 L514 160" stroke="#d1d5db" stroke-width="2"/>
  <path d="M510 155 L516 160 L510 165" fill="none" stroke="#d1d5db" stroke-width="2"/>

  <!-- Paso 4 -->
  <rect x="519" y="62" width="143" height="196" rx="12" fill="#f0fdf4" stroke="#6ee7b7"/>
  <circle cx="590.5" cy="98" r="18" fill="#059669"/>
  <text font-family="Arial" font-size="15" font-weight="600" fill="white" x="590.5" y="103" text-anchor="middle">4</text>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#065f46" x="590.5" y="140" text-anchor="middle">Compará con</text>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#065f46" x="590.5" y="157" text-anchor="middle">la consigna</text>
  <text font-family="Arial" font-size="11" fill="#047857" x="590.5" y="182" text-anchor="middle">No cuál "suena</text>
  <text font-family="Arial" font-size="11" fill="#047857" x="590.5" y="198" text-anchor="middle">mejor", sino cuál</text>
  <text font-family="Arial" font-size="11" fill="#047857" x="590.5" y="214" text-anchor="middle">responde lo que</text>
  <text font-family="Arial" font-size="11" fill="#047857" x="590.5" y="230" text-anchor="middle">se pregunta</text>

  <text font-family="Arial" font-size="11" fill="#9ca3af" x="340" y="284" text-anchor="middle">memorepe.com</text>
</svg>
