<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="340" fill="white"/>
  <text font-family="Arial" font-size="16" font-weight="500" fill="#111" x="340" y="34" text-anchor="middle">El ciclo de estudio con preguntas</text>

  <!-- Responder -->
  <rect x="250" y="60" width="180" height="56" rx="12" fill="#f9fafb" stroke="#e5e7eb"/>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#111" x="340" y="84" text-anchor="middle">Respondés la pregunta</text>
  <text font-family="Arial" font-size="11" fill="#6b7280" x="340" y="102" text-anchor="middle">sin mirar el apunte</text>

  <!-- Flechas a los dos resultados -->
  <path d="M290 116 C 250 140, 190 150, 170 170" fill="none" stroke="#d1d5db" stroke-width="2"/>
  <path d="M164 163 L168 173 L178 169" fill="none" stroke="#d1d5db" stroke-width="2"/>
  <path d="M390 116 C 430 140, 490 150, 510 170" fill="none" stroke="#d1d5db" stroke-width="2"/>
  <path d="M502 169 L512 173 L516 163" fill="none" stroke="#d1d5db" stroke-width="2"/>

  <!-- Acierto -->
  <rect x="60" y="176" width="220" height="92" rx="12" fill="#f0fdf4" stroke="#6ee7b7"/>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#065f46" x="170" y="202" text-anchor="middle">✓ Acertaste</text>
  <text font-family="Arial" font-size="11" fill="#047857" x="170" y="224" text-anchor="middle">La próxima vez aparece</text>
  <text font-family="Arial" font-size="11" fill="#047857" x="170" y="240" text-anchor="middle">más adelante: 1 día, 6 días,</text>
  <text font-family="Arial" font-size="11" fill="#047857" x="170" y="256" text-anchor="middle">después semanas</text>

  <!-- Error -->
  <rect x="400" y="176" width="220" height="92" rx="12" fill="#fef2f2" stroke="#fecaca"/>
  <text font-family="Arial" font-size="13" font-weight="500" fill="#b91c1c" x="510" y="202" text-anchor="middle">✗ Fallaste</text>
  <text font-family="Arial" font-size="11" fill="#b91c1c" x="510" y="224" text-anchor="middle">Leés la explicación y ves</text>
  <text font-family="Arial" font-size="11" fill="#b91c1c" x="510" y="240" text-anchor="middle">qué confundiste. Vuelve</text>
  <text font-family="Arial" font-size="11" fill="#b91c1c" x="510" y="256" text-anchor="middle">pronto para reforzarla</text>

  <!-- Vuelta -->
  <path d="M170 268 C 170 318, 510 318, 510 268" fill="none" stroke="#d1d5db" stroke-width="2" stroke-dasharray="4 4"/>
  <text font-family="Arial" font-size="11" fill="#9ca3af" x="340" y="316" text-anchor="middle">en cada repaso, las preguntas vuelven cuando estás por olvidarlas</text>
</svg>
