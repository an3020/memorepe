<svg width="100%" viewBox="0 0 680 280" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Curva del olvido con SM-2</title>
  <desc>Gráfico que muestra cómo la memoria decae con el tiempo y cómo SM-2 interrumpe esa curva con repasos en el momento exacto</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="60" y1="30" x2="60" y2="200" stroke="#e5e7eb" stroke-width="0.5" fill="none"/>
  <line x1="60" y1="200" x2="640" y2="200" stroke="#e5e7eb" stroke-width="0.5" fill="none"/>

  <text x="50" y="35" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">100%</text>
  <text x="50" y="120" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">50%</text>
  <text x="50" y="200" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="end">0%</text>
  <text x="350" y="222" font-family="Arial, sans-serif" font-size="12" fill="#9ca3af" text-anchor="middle">tiempo</text>

  <!-- Curva sin SM-2 -->
  <path d="M60 35 C120 60 200 120 350 175 C450 195 560 198 640 199" stroke="#d1d5db" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>

  <!-- Segmento 1 -->
  <path d="M60 35 C100 55 140 100 185 148" stroke="#059669" stroke-width="2" fill="none"/>
  <line x1="185" y1="148" x2="185" y2="38" stroke="#059669" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <circle cx="185" cy="148" r="5" fill="#059669"/>
  <circle cx="185" cy="38" r="5" fill="#059669"/>
  <text x="185" y="168" font-family="Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle">repaso 1</text>

  <!-- Segmento 2 -->
  <path d="M185 38 C240 55 300 90 370 138" stroke="#059669" stroke-width="2" fill="none"/>
  <line x1="370" y1="138" x2="370" y2="38" stroke="#059669" stroke-width="1" stroke-dasharray="4 3" fill="none"/>
  <circle cx="370" cy="138" r="5" fill="#059669"/>
  <circle cx="370" cy="38" r="5" fill="#059669"/>
  <text x="370" y="155" font-family="Arial, sans-serif" font-size="12" fill="#059669" text-anchor="middle">repaso 2</text>

  <!-- Segmento 3 -->
  <path d="M370 38 C450 50 540 75 640 100" stroke="#059669" stroke-width="2" fill="none"/>

  <!-- Leyenda -->
  <line x1="60" y1="242" x2="90" y2="242" stroke="#059669" stroke-width="2" fill="none"/>
  <circle cx="75" cy="242" r="4" fill="#059669"/>
  <text x="98" y="247" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">con SM-2</text>

  <line x1="220" y1="242" x2="250" y2="242" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 4" fill="none"/>
  <text x="258" y="247" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">sin repasos</text>
</svg>
